<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Printing Roulette</title>
<meta name="description" content="Spin the roulette and discover a random 3D printing product">
<style>
:root {
  --bg: #0b0d14;
  --tx: #f4f6fb;
  --mu: #8a92a8;
  --gold: #ffd23d;
  --card: #141827;
  --border: #ffffff1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: radial-gradient(1200px 600px at 50% -10%, #2a1a4a 0%, var(--bg) 60%) fixed;
  color: var(--tx);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.4;
}
main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 36px 14px 50px;
  text-align: center;
}
h1 {
  font-size: clamp(26px, 5vw, 42px);
  letter-spacing: .02em;
  background: linear-gradient(90deg, #ff6a3d, #ffd23d, #ff3d8b);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.sub {
  margin: 10px 0 28px;
  color: var(--mu);
  font-size: 1.05rem;
}
.win {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  padding: 22px 0;
  background: linear-gradient(#141827, #0e111b);
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px #0008, inset 0 0 40px #0006;
}
.win:before, .win:after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  width: 18%;
  z-index: 2;
  pointer-events: none;
}
.win:before { left: 0; background: linear-gradient(90deg, #0b0d14, transparent); }
.win:after { right: 0; background: linear-gradient(-90deg, #0b0d14, transparent); }
.mark {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  width: 3px;
  margin-left: -1.5px;
  background: var(--gold);
  z-index: 3;
  box-shadow: 0 0 16px 2px var(--gold);
}
.mark:before, .mark:after {
  content: "";
  position: absolute;
  left: -8px;
  border: 9px solid transparent;
}
.mark:before { top: 0; border-top-color: var(--gold); }
.mark:after { bottom: 0; border-bottom-color: var(--gold); }
.strip {
  display: flex;
  gap: 12px;
  will-change: transform;
}
.it {
  flex: 0 0 168px;
  height: 210px;
  border-radius: 12px;
  background: #1a1f30;
  position: relative;
  overflow: hidden;
  border-bottom: 5px solid var(--r);
  box-shadow: inset 0 -40px 40px -30px var(--r);
  transition: outline .2s, box-shadow .2s;
}
.it img {
  width: 100%;
  height: 132px;
  object-fit: cover;
  display: block;
  background: #0003;
}
.it .t {
  font-size: 12px;
  line-height: 1.25;
  padding: 8px 8px 0;
  color: #dfe3ef;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-align: left;
}
.it .badge {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 6px;
  background: #000a;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.it.w {
  outline: 3px solid var(--gold);
  box-shadow: 0 0 30px var(--gold);
}
#go {
  margin-top: 30px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #fff;
  border: 0;
  border-radius: 14px;
  padding: 18px 60px;
  cursor: pointer;
  background: linear-gradient(135deg, #ff6a3d, #ff2d7a);
  box-shadow: 0 10px 30px #ff2d7a66;
  transition: transform .15s, opacity .2s;
}
#go:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); }
#go:disabled { opacity: .5; cursor: default; transform: none; }
#go:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* History */
.history {
  margin-top: 40px;
  text-align: left;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
}
.history h3 {
  font-size: 1.1rem;
  margin-bottom: 12px;
  color: var(--mu);
  font-weight: 600;
}
.history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
}
.history-item img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 6px;
  background: #0003;
}
.history-item .info { flex: 1; min-width: 0; }
.history-item .name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-item .price { color: var(--gold); font-weight: 700; font-size: 13px; }
.history-empty { color: var(--mu); font-size: 14px; text-align: center; padding: 20px; }

/* Overlay */
#ov {
  position: fixed;
  inset: 0;
  background: #000b;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9;
  padding: 16px;
}
#ov.on { display: flex; }
.box {
  width: min(420px, 100%);
  background: var(--card);
  border-radius: 20px;
  padding: 18px;
  border: 2px solid var(--r);
  box-shadow: 0 0 60px var(--r);
  animation: pop .4s cubic-bezier(.2, 1.2, .4, 1);
  position: relative;
}
@keyframes pop {
  from { transform: scale(.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.box img {
  width: 100%;
  max-height: 280px;
  object-fit: cover;
  border-radius: 12px;
  background: #0003;
}
.box h2 {
  font-size: 18px;
  margin: 14px 0 4px;
  line-height: 1.3;
}
.box .pr {
  color: var(--gold);
  font-weight: 800;
  font-size: 22px;
}
.box .rarity {
  display: inline-block;
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--r);
  color: #fff;
  text-transform: uppercase;
}
.box a.b {
  display: block;
  margin-top: 16px;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, #ff6a3d, #ff2d7a);
  color: #fff;
  text-decoration: none;
  font-weight: 800;
  text-align: center;
  transition: transform .15s;
}
.box a.b:hover { transform: translateY(-1px); }
.box .actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  justify-content: center;
}
.box button {
  all: unset;
  cursor: pointer;
  color: var(--mu);
  font-size: 13px;
  text-decoration: underline;
  padding: 6px 10px;
}
.box button:hover { color: var(--tx); }
.box small {
  display: block;
  margin-top: 10px;
  color: var(--mu);
  font-size: 13px;
}

/* Confetti canvas */
#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>
<main>
  <h1>🖨️ 3D PRINTING ROULETTE</h1>
  <p class="sub">Press the button and let the roulette pick a product for you</p>

  <div class="win" role="region" aria-label="Product roulette">
    <div class="mark" aria-hidden="true"></div>
    <div class="strip" id="strip"></div>
  </div>

  <button id="go" aria-label="Spin the roulette">SPIN</button>

  <section class="history" aria-labelledby="hist-title">
    <h3 id="hist-title">Recent Spins</h3>
    <div class="history-list" id="history"></div>
  </section>
</main>

<div id="ov" role="dialog" aria-modal="true" aria-labelledby="win-title">
  <div class="box" id="box"></div>
</div>
<canvas id="confetti"></canvas>

<script>

  // [id, title, price, image]
  const PRODUCTS = [

    ["VIEz5","Horror Movie Knives Props",1.50,"1k2j0i0rn1jhv1bbvmsg1k7oj5o15.jpg"],
    ["Z1DQz","Highland Cow Figurine",1.99,"g:1k2j08uniefn1bgea1v1d06bal1p"],
    ["s9fVn","Ghostface LED Lantern",1.99,"1k2ivti1g6bq1eck1chc1esk45a1g.jpg"],
    ["T1QPp","Maleficent Candle Holder",1.99,"1k2ivga9v12df1mj6bdm1mbt15eu1a.jpg"],

  // Helpers
  function imgUrl(p) {
    const s = p[3];
    return s.startsWith("g:")
      ? GI + s.slice(2) + ".gif"
      : "https://payhip.com/cdn-cgi/image/format=auto,width=750/" + S3 + s;
  }

  function rarity(p) {
    const x = p[2];
    if (x >= 2.5) return { color: "#ffd23d", label: "Legendary" };
    if (x >= 2.2) return { color: "#eb4b4b", label: "Epic" };
    if (x >= 1.99) return { color: "#d32ce6", label: "Rare" };
    if (x >= 1.5)  return { color: "#8847ff", label: "Uncommon" };
    return { color: "#4b69ff", label: "Common" };
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // DOM
  const strip = document.getElementById("strip");
  const goBtn = document.getElementById("go");
  const ov = document.getElementById("ov");
  const box = document.getElementById("box");
  const historyEl = document.getElementById("history");
  const confettiCanvas = document.getElementById("confetti");
  const ctx = confettiCanvas.getContext("2d");

  const ITEM_W = 180;
  let busy = false;
  let redirectTimer = null;
  let particles = [];

  // ── Sound Engine (Web Audio API – no external files) ──
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let spinOsc = null;
  let spinGain = null;
  let spinInterval = null;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new AudioCtx();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Soft click / button press
  function playClick() {
    try {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(420, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  // Spinning / ticking sound that slows down
  function startSpinSound() {
    try {
      const ctx = ensureAudio();
      stopSpinSound();

      spinGain = ctx.createGain();
      spinGain.gain.setValueAtTime(0.12, ctx.currentTime);
      spinGain.connect(ctx.destination);

      let tickRate = 28; // starts fast
      const start = ctx.currentTime;

      function tick() {
        if (!busy) return;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "square";
        osc.frequency.value = 180 + Math.random() * 40;
        g.gain.setValueAtTime(0.09, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        osc.connect(g);
        g.connect(spinGain);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);

        // Slow down over ~7 seconds
        const elapsed = ctx.currentTime - start;
        tickRate = Math.max(4, 28 - elapsed * 3.2);
        spinInterval = setTimeout(tick, 1000 / tickRate);
      }
      tick();
    } catch (e) {}
  }

  function stopSpinSound() {
    if (spinInterval) {
      clearTimeout(spinInterval);
      spinInterval = null;
    }
    if (spinGain) {
      try { spinGain.disconnect(); } catch (e) {}
      spinGain = null;
    }
  }

  // Win / success chime
  function playWinSound() {
    try {
      const ctx = ensureAudio();
      stopSpinSound();

      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const t = ctx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.5);
      });
    } catch (e) {}
  }

  // Preload a few images
  function preloadImages() {
    const sample = shuffle(PRODUCTS).slice(0, 12);
    sample.forEach(p => {
      const img = new Image();
      img.src = imgUrl(p);
    });
  }

  // History (localStorage)
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem("roulette_history") || "[]");
    } catch {
      return [];
    }
  }

  function saveHistory(list) {
    localStorage.setItem("roulette_history", JSON.stringify(list.slice(0, 8)));
  }

  function renderHistory() {
    const list = loadHistory();
    if (!list.length) {
      historyEl.innerHTML = '<div class="history-empty">No spins yet. Try your luck!</div>';
      return;
    }
    historyEl.innerHTML = list.map(p => {
      const r = rarity(p);
      return `
        <div class="history-item">
          <img src="${imgUrl(p)}" alt="" loading="lazy" onerror="this.style.opacity=0.3">
          <div class="info">
            <div class="name">${p[1]}</div>
            <div class="price">$${p[2].toFixed(2)} · ${r.label}</div>
          </div>
        </div>`;
    }).join("");
  }

  // Build strip cells
  function createCell(p) {
    const r = rarity(p);
    const d = document.createElement("div");
    d.className = "it";
    d.style.setProperty("--r", r.color);
    d.innerHTML = `
      <img referrerpolicy="no-referrer" src="${imgUrl(p)}" alt="" loading="lazy"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 168 132%22><rect fill=%22%231a1f30%22 width=%22168%22 height=%22132%22/></svg>'">
      <div class="badge" style="background:${r.color}">${r.label}</div>
      <div class="t">${p[1]}</div>`;
    return d;
  }

  function buildStrip(list) {
    strip.innerHTML = "";
    list.forEach(p => strip.appendChild(createCell(p)));
  }

  function idleStrip() {
    const list = shuffle(PRODUCTS).concat(shuffle(PRODUCTS));
    buildStrip(list);
    strip.style.transition = "none";
    strip.style.transform = "translateX(0)";
  }

  // Confetti
  function resizeCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function spawnConfetti() {
    particles = [];
    const colors = ["#ff6a3d", "#ffd23d", "#ff3d8b", "#8847ff", "#4b69ff", "#eb4b4b"];
    for (let i = 0; i < 120; i++) {
      particles.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 200,
        y: confettiCanvas.height / 2 - 40,
        vx: (Math.random() - 0.5) * 14,
        vy: Math.random() * -12 - 4,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 10,
        life: 1
      });
    }
    requestAnimationFrame(tickConfetti);
  }

  function tickConfetti() {
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.rot += p.vr;
      p.life -= 0.012;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if (alive) requestAnimationFrame(tickConfetti);
  }

  // Show winner
  function showWinner(p) {
    const r = rarity(p);
    const url = B + p[0];
    box.style.setProperty("--r", r.color);
    box.innerHTML = `
      <img referrerpolicy="no-referrer" src="${imgUrl(p)}" alt="${p[1]}"
           onerror="this.style.opacity=0.4">
      <h2 id="win-title">${p[1]}</h2>
      <div class="pr">$${p[2].toFixed(2)}</div>
      <div class="rarity">${r.label}</div>
      <a class="b" target="_blank" rel="noopener" href="${url}">Open Product →</a>
      <div class="actions">
        <button id="close-btn">Close</button>
        <button id="spin-again">Spin Again</button>
      </div>
      <small id="redirect-msg" style="display:none">Redirecting in <span id="c">6</span>s…</small>`;

    ov.classList.add("on");
    spawnConfetti();

    // History
    const hist = loadHistory();
    hist.unshift(p);
    saveHistory(hist);
    renderHistory();

    // Optional soft redirect (disabled by default for better UX)
    // Uncomment the next lines if you want auto-redirect:
    /*
    let n = 6;
    const msg = document.getElementById("redirect-msg");
    msg.style.display = "block";
    clearInterval(redirectTimer);
    redirectTimer = setInterval(() => {
      n--;
      const c = document.getElementById("c");
      if (c) c.textContent = n;
      if (n <= 0) {
        clearInterval(redirectTimer);
        window.open(url, "_blank");
      }
    }, 1000);
    */

    document.getElementById("close-btn").onclick = closeOverlay;
    document.getElementById("spin-again").onclick = () => {
      closeOverlay();
      setTimeout(() => goBtn.click(), 300);
    };
  }

  function closeOverlay() {
    clearInterval(redirectTimer);
    stopSpinSound();
    ov.classList.remove("on");
    particles = [];
    ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }

  // Spin logic
  goBtn.addEventListener("click", () => {
    if (busy) return;
    busy = true;
    goBtn.disabled = true;
    goBtn.textContent = "SPINNING…";

    playClick();
    startSpinSound();

    const winner = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)];
    const N = 48;
    let list = [];
    while (list.length < N + 12) list = list.concat(shuffle(PRODUCTS));
    list = list.slice(0, N + 12);
    list[N] = winner;

    buildStrip(list);
    strip.style.transition = "none";
    strip.style.transform = "translateX(0)";

    const half = strip.parentElement.clientWidth / 2;
    const jitter = (Math.random() - 0.5) * 100;

    // Force reflow
    void strip.offsetWidth;

    strip.style.transition = "transform 7.2s cubic-bezier(.08, .7, .12, 1)";
    strip.style.transform = `translateX(${-(N * ITEM_W + 84 - half + jitter)}px)`;

    setTimeout(() => {
      const winCell = strip.children[N];
      if (winCell) winCell.classList.add("w");
      stopSpinSound();
      setTimeout(() => {
        playWinSound();
        showWinner(winner);
        busy = false;
        goBtn.disabled = false;
        goBtn.textContent = "SPIN";
      }, 650);
    }, 7300);
  });

  // Keyboard support
  goBtn.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      goBtn.click();
    }
  });

  // Escape closes overlay
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && ov.classList.contains("on")) closeOverlay();
  });

  // Init
  idleStrip();
  renderHistory();
  preloadImages();
})();
</script>
</body>
</html>
